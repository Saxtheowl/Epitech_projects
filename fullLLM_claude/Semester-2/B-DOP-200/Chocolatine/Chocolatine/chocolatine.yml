name: chocolatine

env:
  MIRROR_URL: "git@github.com:EpitechPromo2027/B-DOP-200-LIL-2-1-chocolatine-username.git"
  EXECUTABLES: "my_program"

on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    branches-ignore:
      - "ga-ignore-*"

jobs:
  check_coding_style:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epitech/coding-style-checker:latest
    if: ${{ github.repository != env.MIRROR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run coding style checker
        run: check.sh $(pwd) $(pwd)

      - name: Display coding style errors
        if: failure()
        run: |
          if [ -f coding-style-reports.log ]; then
            while IFS=: read -r file line type error_type; do
              if [ -n "$file" ] && [ -n "$line" ] && [ -n "$error_type" ]; then
                echo "::error file=$file,line=$line::$error_type"
              fi
            done < coding-style-reports.log
            exit 1
          fi

  check_program_compilation:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    needs: check_coding_style
    if: ${{ github.repository != env.MIRROR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile project
        run: make
        timeout-minutes: 2

      - name: Clean project
        run: make clean

      - name: Check executables exist and are executable
        run: |
          IFS=',' read -ra EXEC_ARRAY <<< "$EXECUTABLES"
          for exec in "${EXEC_ARRAY[@]}"; do
            if [ ! -f "$exec" ]; then
              echo "Error: Executable $exec does not exist"
              exit 1
            fi
            if [ ! -x "$exec" ]; then
              echo "Error: $exec is not executable"
              exit 1
            fi
            echo "✓ $exec exists and is executable"
          done

  run_tests:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    needs: check_program_compilation
    if: ${{ github.repository != env.MIRROR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: make tests_run
        timeout-minutes: 2

  push_to_mirror:
    runs-on: ubuntu-latest
    needs: run_tests
    if: ${{ github.event_name == 'push' && github.repository != env.MIRROR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}