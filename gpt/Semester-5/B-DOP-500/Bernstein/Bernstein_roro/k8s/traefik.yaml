# File description:
#   Traefik deployment and service (NodePort)
#

apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: kube-public
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: kube-public
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-public
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
      - name: traefik
        image: traefik:2.7
        args:
          - "--api.insecure=true"
          - "--providers.kubernetesingress=true"
          - "--entrypoints.web.address=:80"
          - "--entrypoints.dashboard.address=:8080"
        ports:
          - name: web
            containerPort: 80
          - name: dashboard
            containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-public
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30021
      protocol: TCP
    - name: dashboard
      port: 8080
      targetPort: 8080
      nodePort: 30042
      protocol: TCP

