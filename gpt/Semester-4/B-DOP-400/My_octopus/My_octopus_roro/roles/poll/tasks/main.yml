# My_octopus - poll role
#

- name: Install Python and Flask
  apt:
    name:
      - python3
      - python3-pip
    state: present

- name: Install Flask
  pip:
    name: Flask
    executable: pip3

- name: Deploy poll app
  copy:
    src: app.py
    dest: /opt/poll/app.py
    owner: root
    group: root
    mode: '0644'

- name: Install poll systemd service
  copy:
    dest: /etc/systemd/system/poll.service
    content: |
      [Unit]
      Description=Poll Web Client
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/poll/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Enable and start poll service
  service:
    name: poll
    state: started
    enabled: yes

