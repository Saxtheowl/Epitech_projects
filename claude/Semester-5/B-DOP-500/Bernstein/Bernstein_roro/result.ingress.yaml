## Result ingress configuration for Traefik
##

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.rule: "Host(`result.dop.io`)"
spec:
  rules:
  - host: result.dop.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: result
            port:
              number: 80