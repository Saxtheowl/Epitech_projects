## Traefik load balancer service configuration
##

apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kube-public
  labels:
    app: traefik
spec:
  selector:
    app: traefik
  ports:
  - name: web
    port: 80
    targetPort: 80
    nodePort: 30021
  - name: admin
    port: 8080
    targetPort: 8080
    nodePort: 30042
  type: NodePort