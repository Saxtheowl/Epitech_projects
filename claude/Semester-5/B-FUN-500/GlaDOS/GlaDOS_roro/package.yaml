name:                glados
version:             1.0.0.0
github:              "epitech/glados"
license:             MIT
author:              "GLaDOS Team"
maintainer:          "glados@example.com"
copyright:           "2025 Epitech"

extra-source-files:
- README.md

synopsis:            Generic Language and Data Operand Syntax
category:            Compiler

description:         GLaDOS is a functional programming language interpreter and compiler

dependencies:
- base >= 4.7 && < 5
- containers
- mtl
- text

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  glados:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - glados

tests:
  glados-test:
    main:                Spec.hs
    source-dirs:         tests
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - glados
    - hspec
    - QuickCheck