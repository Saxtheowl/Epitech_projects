name: Chocolatine

env:
  MIRROR_URL: "git@github.com:EpitechPromo2026/B-DOP-200-STG-2-1-chocolatine-roro.renaud.git"
  EXECUTABLES: ""

on:
  push:
    branches-ignore:
      - "ga-ignore-**"
  pull_request:
    branches-ignore:
      - "ga-ignore-**"

jobs:
  check_coding_style:
    name: "Coding Style"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epitech/coding-style-checker:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Run coding style check
        run: |
          check.sh $(pwd) $(pwd)
          if [ -f coding-style-reports.log ]; then
            while IFS= read -r line; do
              file_path=$(echo "$line" | cut -d':' -f1)
              line_number=$(echo "$line" | cut -d':' -f2)
              error_type=$(echo "$line" | cut -d':' -f3)
              error_msg=$(echo "$line" | cut -d':' -f4-)
              echo "::error file=$file_path,line=$line_number::$error_type $error_msg"
            done < coding-style-reports.log
            exit 1
          fi

  check_program_compilation:
    name: "Program Compilation"
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    needs: check_coding_style
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Compile program
        run: make
        timeout-minutes: 2
      
      - name: Clean compiled files
        run: make clean

  run_tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    needs: check_program_compilation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Run tests
        run: make tests_run
        timeout-minutes: 2

  push_to_mirror:
    name: "Push to Mirror"
    runs-on: ubuntu-latest
    needs: run_tests
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}