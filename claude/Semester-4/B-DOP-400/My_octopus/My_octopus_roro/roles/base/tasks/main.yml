---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - vim
      - git
      - htop
      - unzip
      - tar
      - python3
      - python3-pip
    state: present

- name: Ensure system is up to date
  apt:
    upgrade: dist
    update_cache: yes